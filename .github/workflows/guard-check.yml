name: CampusFlow Guard Check

on:
  pull_request:
    branches:
      - main

jobs:
  changelog-and-scope-guard:
    name: guard-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run CampusFlow Guard Check
        run: node scripts/guard-check.mjs "${{ github.head_ref }}" "origin/${{ github.base_ref }}" "HEAD"
